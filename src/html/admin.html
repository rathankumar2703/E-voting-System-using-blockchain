<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Admin Portal</title>
  <link rel="stylesheet" type="text/css" href="/css/admin.css">
</head>
<body>
  <div id="head" class="text-center">
    <h1 align="center" style="color: azure;">Decentralized Voting Using Ethereum Blockchain</h1>
    <br/> 
  </div>
  <div class="container">
    <legend>Add Candidate</legend>  
    <table class="table text-center"> 
      <tr>
        <th>Name</th><td><input id="name" type="text" placeholder="Candidate's name" autocomplete="off"></td>  
        <th>Party</th><td><input id="party" type="text" placeholder="Candidate's party"></td> 
      </tr>
    </table> 
    <button id="addCandidate">Add Candidate</button>
    <p id="Aday"></p>
  </div>
  <div class="container">
    <legend>Define Voting Dates</legend>  
    <table class="table text-center"> 
      <tr>              
        <th>Start date</th><td><input id="startDate" type="date"></td>
        <th>End date</th><td><input id="endDate" type="date"></td>
      </tr>
    </table> 
    <button id="addDate">Define Dates</button>
    <p id="AdayDates"></p>
  </div>
  <div id="account">
    <p id="accountAddress" class="text-center"></p>
  </div>
  <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.3.1/jquery.min.js"></script>
  <script src="/dist/app.bundle.js"></script>
</body>
</html>
