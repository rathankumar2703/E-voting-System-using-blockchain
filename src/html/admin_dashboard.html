<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - E-Voting</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Roboto&family=Montserrat:wght@700&display=swap" rel="stylesheet">
    <link href="/css/styles.css" rel="stylesheet">
</head>
<body>
    <div class="container">
        <h1 class="text-center my-5">Admin Dashboard</h1>
        <p id="accountAddress" class="text-center mb-4"></p>
        <div class="row justify-content-center">
            <div class="col-lg-10">
                <div class="card">
                    <h2 class="text-center">Add Candidate</h2>
                    <form id="candidateForm" enctype="multipart/form-data">
                        <input type="text" id="name" class="form-control" placeholder="Candidate Name" required>
                        <input type="text" id="party" class="form-control" placeholder="Party" required>
                        <input type="file" id="symbol" class="form-control" accept="image/*" required>
                        <button type="submit" class="btn btn-primary w-100">Add Candidate</button>
                    </form>
                    <p id="Aday" class="mt-3 text-center"></p>
                </div>
                <div class="card">
                    <h2 class="text-center">Set Voting Dates</h2>
                    <input type="date" id="startDate" class="form-control" required>
                    <input type="date" id="endDate" class="form-control" required>
                    <button id="addDate" class="btn btn-primary w-100 mt-3">Set Dates</button>
                    <p id="AdayDates" class="mt-3 text-center"></p>
                </div>
                <div class="card">
                    <h2 class="text-center">Emergency Stop</h2>
                    <button id="toggleStop" class="btn btn-primary w-100">Toggle Emergency Stop</button>
                    <p id="stopStatus" class="mt-3 text-center"></p>
                </div>
                <div class="card">
                    <h2 class="text-center">Candidates & Results</h2>
                    <table class="table">
                        <thead>
                            <tr>
                                <th>Name</th>
                                <th>Party</th>
                                <th>Symbol</th>
                                <th>Votes</th>
                            </tr>
                        </thead>
                        <tbody id="resultTable"></tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
    <script src="/dist/app.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
