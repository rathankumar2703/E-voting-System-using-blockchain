<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vote - E-Voting</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Roboto&family=Montserrat:wght@700&display=swap" rel="stylesheet">
    <link href="/css/styles.css" rel="stylesheet">
</head>
<body>
    <div class="container">
        <h1 class="text-center my-5">Cast Your Vote</h1>
        <p id="accountAddress" class="text-center mb-4"></p>
        <div class="row justify-content-center">
            <div class="col-lg-10">
                <div class="card">
                    <h2 class="text-center">Voter Profile</h2>
                    <img id="voterImage" class="profile-img" alt="Voter Image">
                    <div class="row">
                        <div class="col-md-6">
                            <p><strong>Name:</strong> <span id="voterName"></span></p>
                            <p><strong>DOB:</strong> <span id="voterDOB"></span></p>
                            <p><strong>Aadhaar:</strong> <span id="voterAadhaar"></span></p>
                        </div>
                        <div class="col-md-6">
                            <p><strong>Gender:</strong> <span id="voterGender"></span></p>
                            <p><strong>Phone:</strong> <span id="voterPhone"></span></p>
                            <p><strong>Email:</strong> <span id="voterEmail"></span></p>
                        </div>
                    </div>
                    <p id="registrationStatus" class="mt-3 text-center"></p>
                </div>
                <div class="card">
                    <h2 class="text-center">Voting Period</h2>
                    <p id="dates" class="text-center"></p>
                    <p id="emergencyStatus" class="text-center"></p>
                </div>
                <div class="card">
                    <h2 class="text-center">Candidates</h2>
                    <table class="table">
                        <thead>
                            <tr>
                                <th>Select</th>
                                <th>Name</th>
                                <th>Party</th>
                                <th>Symbol</th>
                                <th>Votes</th>
                            </tr>
                        </thead>
                        <tbody id="boxCandidate"></tbody>
                    </table>
                    <button id="voteButton" class="btn btn-primary w-100 mt-3" disabled>Cast Your Vote</button>
                    <p id="msg" class="mt-3 text-center"></p>
                </div>
            </div>
        </div>
    </div>
    <script src="/dist/app.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
