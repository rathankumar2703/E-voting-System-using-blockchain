<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - E-Voting</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Roboto&family=Montserrat:wght@700&display=swap" rel="stylesheet">
    <link href="/css/styles.css" rel="stylesheet">
</head>
<body>
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-6 col-lg-5">
                <div class="card">
                    <h1 class="text-center">Register</h1>
                    <form id="registerForm" enctype="multipart/form-data">
                        <input type="text" id="voter-id" class="form-control" placeholder="Voter ID" required>
                        <input type="password" id="password" class="form-control" placeholder="Password" required>
                        <input type="text" id="name" class="form-control" placeholder="Full Name" required>
                        <input type="date" id="dob" class="form-control" required>
                        <input type="text" id="aadhaar" class="form-control" placeholder="Aadhaar (12 digits)" required>
                        <select id="gender" class="form-control" required>
                            <option value="Male">Male</option>
                            <option value="Female">Female</option>
                            <option value="Other">Other</option>
                        </select>
                        <input type="text" id="phone" class="form-control" placeholder="Phone (10 digits)" required>
                        <input type="email" id="email" class="form-control" placeholder="Email" required>
                        <input type="file" id="image" class="form-control" accept="image/*" required>
                        <button type="submit" class="btn btn-primary w-100">Register</button>
                    </form>
                    <p id="registerMsg" class="text-center mt-3"></p>
                </div>
            </div>
        </div>
    </div>
    <script src="/dist/register.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
